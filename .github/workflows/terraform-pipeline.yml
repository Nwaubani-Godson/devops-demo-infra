name: Infrastructure & GitOps Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ app-image-updated ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  terraform-dev-plan:
    name: Dev — Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654484434:role/GitHubActionsRole-DevOpsDemo
          aws-region: us-east-1
          role-session-name: GitHubActions-DevPlan

      - name: Terraform Init
        run: terraform init

      - name: Update Image Tag Variable (if dispatched)
        if: github.event.client_payload.image_tag != ''
        run: |
          echo "image_tag = \"${{ github.event.client_payload.image_tag }}\"" > terraform.auto.tfvars

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

  terraform-dev-apply:
    name: Dev — Terraform Apply (Auto)
    needs: terraform-dev-plan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654484434:role/GitHubActionsRole-DevOpsDemo
          aws-region: us-east-1
          role-session-name: GitHubActions-DevApply

      - name: Terraform Init
        run: terraform init

      - name: Update Image Tag Variable
        if: github.event.client_payload.image_tag != ''
        run: |
          echo "image_tag = \"${{ github.event.client_payload.image_tag }}\"" > terraform.auto.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve

  terraform-staging:
    name: Staging — Gated Promotion (Approval Required)
    needs: terraform-dev-apply
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654484434:role/GitHubActionsRole-DevOpsDemo
          aws-region: us-east-1
          role-session-name: GitHubActions-Staging

      - name: Terraform Init
        run: terraform init

      - name: Update Image Tag Variable
        if: github.event.client_payload.image_tag != ''
        run: |
          echo "image_tag = \"${{ github.event.client_payload.image_tag }}\"" > terraform.auto.tfvars

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

  terraform-prod:
    name: Production — Gated Promotion (Strict Approval Required)
    needs: terraform-staging
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654484434:role/GitHubActionsRole-DevOpsDemo
          aws-region: us-east-1
          role-session-name: GitHubActions-Prod

      - name: Terraform Init
        run: terraform init

      - name: Update Image Tag Variable
        if: github.event.client_payload.image_tag != ''
        run: |
          echo "image_tag = \"${{ github.event.client_payload.image_tag }}\"" > terraform.auto.tfvars

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
